name: Build IPA

# Builds an unsigned SKY.ipa on a GitHub macOS runner. Sign and install it
# yourself (e.g. Sideloadly with your Apple ID). Runs on every push to main
# and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the IPA as a release

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -project SKY.xcodeproj -scheme SKY -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/SKY.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package SKY.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/SKY.xcarchive/Products/Applications/SKY.app out/Payload/
          cd out && zip -qry SKY.ipa Payload
          ls -lh SKY.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SKY-ipa
          path: out/SKY.ipa
          retention-days: 30

      # Fixed download link, no sign-in needed:
      # https://github.com/<owner>/<repo>/releases/latest/download/SKY.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ipa --yes --cleanup-tag || true
          gh release create ipa out/SKY.ipa --latest \
            --title "SKY iOS build ${{ github.run_number }}" \
            --notes "Unsigned IPA built from ${GITHUB_SHA::7}. Install with Sideloadly (see README)."
