name: Swift app CI

# Native SwiftUI app (branch "swift"): build, unit tests, simulator screenshots of
# every screen in demo mode, and an unsigned IPA. Results are published to the
# "swift-ci" pre-release so they can be fetched without signing in:
#   https://github.com/<owner>/<repo>/releases/download/swift-ci/<file>
on:
  push:
    branches: [swift]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release slot
        run: |
          gh release view swift-ci >/dev/null 2>&1 || \
            gh release create swift-ci --prerelease --title "Swift app CI" --notes "Latest CI output of the swift branch."
          echo "run ${{ github.run_number }} ${GITHUB_SHA::7} started $(date -u)" > status.txt
          gh release upload swift-ci status.txt --clobber

      - name: Generate the Xcode project
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild -version

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  n = x["name"]
                  if n.startswith("iPhone") and "Pro" in n and "Max" not in n:
                      best = (rt, x["udid"], n)
          if not best:
              for rt, devs in d.items():
                  for x in devs:
                      if x["name"].startswith("iPhone"): best = (rt, x["udid"], x["name"])
          print(best[1]); print(best, file=sys.stderr)
          ')
          echo "UDID=$UDID" >> $GITHUB_ENV

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project SKY.xcodeproj -scheme SKY \
            -destination "id=$UDID" -derivedDataPath build/dd 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|never)|BUILD" || true
          grep -q "TEST BUILD SUCCEEDED" build.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building -project SKY.xcodeproj -scheme SKY \
            -destination "id=$UDID" -derivedDataPath build/dd 2>&1 | tee test.log | tail -n 40

      - name: Screenshots (demo mode)
        if: always() && hashFiles('build/dd/Build/Products/Debug-iphonesimulator/SKY.app/Info.plist') != ''
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/SKY.app
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.skyline.exchange >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.skyline.exchange -demo "$@" >/dev/null
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$name.png" >/dev/null
          }
          while read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            [ -z "$line" ] && continue
            case "$line" in \#*) continue;; esac
            shot $line
          done < scripts/screens.txt
          (cd shots && zip -q ../screenshots.zip *.png)
          ls shots

      - name: Archive (unsigned IPA)
        run: |
          set -o pipefail
          xcodebuild archive -project SKY.xcodeproj -scheme SKY -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/SKY.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log | grep -E "error:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          mkdir -p out/Payload
          cp -R build/SKY.xcarchive/Products/Applications/SKY.app out/Payload/
          (cd out && zip -qry ../SKY-swift.ipa Payload)
          ls -lh SKY-swift.ipa

      - name: Publish results
        if: always()
        run: |
          {
            echo "run ${{ github.run_number }} ${GITHUB_SHA::7} finished $(date -u)"
            echo "--- build errors ---"
            grep -E "error:" build.log 2>/dev/null | sort -u | head -n 200 || true
            echo "--- archive errors ---"
            grep -E "error:" archive.log 2>/dev/null | sort -u | head -n 50 || true
            echo "--- tests ---"
            grep -E "Test Case|error|failed|passed|TEST" test.log 2>/dev/null | tail -n 60 || true
          } > status.txt
          gh release upload swift-ci status.txt --clobber
          for f in screenshots.zip SKY-swift.ipa; do
            [ -f "$f" ] && gh release upload swift-ci "$f" --clobber || true
          done
          tail -c 200000 build.log > build-tail.log 2>/dev/null && gh release upload swift-ci build-tail.log --clobber || true
